<!DOCTYPE html>
<html>
<head>
    <title>Largest in Array</title>
</head>
<body>

    <h2>Find Largest Number in Array</h2>
    <label>Enter integers (comma separated):</label><br>
    <input type="text" id="numbers" placeholder="e.g. 10,25,5,40,18">
    <br><br>
    <button onclick="findLargest()">Find Largest</button>
    <h3 id="result"></h3>

    <script>
        function findLargest() {
            let input = document.getElementById("numbers").value;
            let arr = input.split(",").map(Number);
            let largest = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] > largest) {
                    largest = arr[i];
                }
            }

            document.getElementById("result").innerHTML =
                "Largest Number: " + largest;
        }
    </script>

</body>
</html>
