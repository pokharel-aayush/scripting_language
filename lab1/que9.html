<!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest of Three</title>
</head>
<body>

    <h2>Find Largest and Smallest</h2>
    <label>First Integer:</label><br>
    <input type="number" id="num1"><br><br>
    <label>Second Integer:</label><br>
    <input type="number" id="num2"><br><br>
    <label>Third Integer:</label><br>
    <input type="number" id="num3"><br><br>
    <button onclick="findNumbers()">Find</button>
    <h3 id="result"></h3>

    <script>
        function findNumbers() {
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);
            let num3 = parseInt(document.getElementById("num3").value);

            let largest = num1;
            let smallest = num1;

            if (num2 > largest) largest = num2;
            if (num3 > largest) largest = num3;
            if (num2 < smallest) smallest = num2;
            if (num3 < smallest) smallest = num3;

            document.getElementById("result").innerHTML =
                "Largest: " + largest + "<br>Smallest: " + smallest;
        }
    </script>

</body>
</html>
