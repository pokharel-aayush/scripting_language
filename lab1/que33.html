<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>
<body>
<h2 style="text-align:center;">Calculator</h2>
<div id="calculator">
    <input type="text" id="display" readonly>
    <button onclick="clearDisplay()">C</button>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="appendValue('/')">/</button>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="appendValue('*')">*</button>
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('-')">-</button>
    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button onclick="calculate()">=</button>
    <button onclick="appendValue('+')">+</button>
</div>
<script>
    let calculator = document.getElementById("calculator");
    calculator.style.width = "340px";
    calculator.style.margin = "20px auto";
    calculator.style.display = "grid";
    calculator.style.gridTemplateColumns = "repeat(4,80px)";
    calculator.style.gap = "5px";
    let display = document.getElementById("display");
    display.style.gridColumn = "span 3";
    display.style.height = "50px";
    display.style.fontSize = "22px";
    display.style.textAlign = "right";
    display.style.padding = "5px";
    let buttons = document.querySelectorAll("button");
    buttons.forEach(function(btn){
        btn.style.height = "60px";
        btn.style.fontSize = "22px";
        btn.style.backgroundColor = "green";
        btn.style.color = "white";
        btn.style.border = "none";
        btn.style.cursor = "pointer";
    });
    function appendValue(value){
        display.value += value;
    }
    function clearDisplay(){
        display.value = "";
    }
    function calculate(){
        try{
            display.value = eval(display.value);
        }
        catch(error){
            display.value = "Error";
        }
    }
</script>
</body>
</html>
