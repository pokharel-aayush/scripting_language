<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2c3e50;
            font-family: 'Arial', sans-serif;
        }
        .clock {
            background: #34495e;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .time {
            font-size: 60px;
            color: #ecf0f1;
            letter-spacing: 4px;
            font-weight: bold;
            text-shadow: 0 0 20px #3498db;
        }
        .label {
            color: #bdc3c7;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="clock">
        <div class="time" id="digitalClock">00:00:00</div>
        <div class="label">Nepal Time</div>
    </div>

    <script>
        function updateDigitalClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // Add leading zeros
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("digitalClock").innerHTML = hours + ":" + minutes + ":" + seconds;
        }

        updateDigitalClock();
        setInterval(updateDigitalClock, 1000);
    </script>

</body>
</html>
