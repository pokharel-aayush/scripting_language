<!DOCTYPE html>
<html>
<head>
    <title>Date Difference in Days</title>
</head>
<body>

    <h2>Difference Between Two Dates</h2>
    <label>First Date:</label><br>
    <input type="date" id="date1"><br><br>
    <label>Second Date:</label><br>
    <input type="date" id="date2"><br><br>
    <button onclick="getDateDifference()">Calculate</button>
    <h3 id="result"></h3>

    <script>
        function getDateDifference() {
            let date1 = new Date(document.getElementById("date1").value);
            let date2 = new Date(document.getElementById("date2").value);
            let diff = Math.abs(date2.getTime() - date1.getTime());
            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("result").innerHTML =
                "Difference: <b>" + days + "</b> day(s).";
        }
    </script>

</body>
</html>
